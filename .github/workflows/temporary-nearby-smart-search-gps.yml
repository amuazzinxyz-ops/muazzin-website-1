name: Temporary Nearby Smart Search GPS repair
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/temporary-nearby-smart-search-gps.yml
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore precise GPS search without blank tabs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path("1.New.Muazzin Saheb.Html")
          s = p.read_text(encoding="utf-8")
          marker = "<!-- Nearby Smart Search: separate from the existing Nearby Masjid feature. -->"
          region = s.find(marker)
          start = s.find("function search(q){", region)
          end_marker = " // Capture this new action before the existing generic menu handler; the old Masjid action remains untouched."
          end = s.find(end_marker, start)
          if region < 0 or start < 0 or end < 0:
              raise SystemExit("Nearby Smart Search function not found; refusing to change the HTML.")
          replacement = r"""function search(q){
            q=String(q||input.value||'').trim();
            var d=text[lang()]||text.roman;
            if(!q){status.dataset.state='custom';status.textContent=d.empty;input.focus();return}
            input.value=q;
            var query=normalize(q);
            status.dataset.state='custom';
            status.textContent=d.opening;
            var nearbyWords=/\b(nearby|near\s+me|mere\s+paas|mere\s+pass|mere\s+nazdeek|qareeb|ner\s+me|near\s+mi)\b|मेरे\s+पास|नज़दीक|قریب/i.test(q);
            var placeCategory=/\b(madrasa|madarsa|masjid|mosque|musjid|eidgah|restaurant|resturant|food|dhaba|halal|hotel|hostel|lodge|pharmacy|chemist|medical shop|hospital|doctor|clinic|dentist|bank|atm|cash machine|petrol pump|gas station|fuel station|grocery|supermarket|market|shop|store|bakery|mechanic|garage|parking|toilet|washroom|bus stop|railway station|train station|airport|school|college|university|library|park|police station|post office|मदरसा|मस्जिद|ईदगाह|अस्पताल|डॉक्टर|दुकान|दवा|पेट्रोल|बैंक|एटीएम|बाज़ार|बाजार|शौचालय)/i.test(q);
            var wantsNearby=nearbyWords||placeCategory||/\bnear\s+me\b/i.test(query);
            function mapsUrl(term){return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(term)}
            var fallbackQuery=query;
            if(wantsNearby&&!/\bnear\s+me\b/i.test(fallbackQuery)) fallbackQuery=fallbackQuery+' near me';
            // Open a real Maps page synchronously from the tap; never open about:blank.
            var opened=null;
            try{opened=window.open(mapsUrl(fallbackQuery),'_blank')}catch(e){}
            if(!wantsNearby||!navigator.geolocation){
              status.textContent=d.ready;
              if(!opened) window.location.href=mapsUrl(fallbackQuery);
              return;
            }
            // Upgrade the already-open Maps tab to a coordinate-based search when GPS responds.
            navigator.geolocation.getCurrentPosition(function(pos){
              var lat=Number(pos.coords.latitude),lon=Number(pos.coords.longitude);
              if(!Number.isFinite(lat)||!Number.isFinite(lon)||Math.abs(lat)>90||Math.abs(lon)>180){
                status.textContent=d.ready;
                if(!opened) window.location.href=mapsUrl(fallbackQuery);
                return;
              }
              var specific=query.replace(/\bnear\s+me\b/ig,'').replace(/\bnearby\b/ig,'').replace(/\bmere paas\b/ig,'').replace(/\bmere pass\b/ig,'').replace(/\bmere nazdeek\b/ig,'').replace(/\bqareeb( mein)?\b/ig,'').replace(/\bner me\b/ig,'').replace(/\bnear mi\b/ig,'').replace(/मेरे\s+पास/ig,'').replace(/नज़दीक/ig,'').replace(/قریب/ig,'').replace(/\s+/g,' ').trim();
              if(!specific) specific=q;
              var preciseUrl=mapsUrl(specific+' near '+lat.toFixed(6)+','+lon.toFixed(6));
              status.textContent=d.ready;
              if(opened&&!opened.closed){try{opened.location.href=preciseUrl;return}catch(e){}}
              window.location.href=preciseUrl;
            },function(){
              // GPS denied/unavailable: the direct Maps near-me fallback remains usable.
              status.textContent=d.ready;
              if(!opened) window.location.href=mapsUrl(fallbackQuery);
            },{enableHighAccuracy:true,timeout:10000,maximumAge:30000});
          }
          """
          s = s[:start] + replacement + s[end:]
          p.write_text(s, encoding="utf-8")
          PY
          git rm .github/workflows/temporary-nearby-smart-search-gps.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "1.New.Muazzin Saheb.Html"
          git commit -m "Restore precise GPS for Nearby Smart Search"
          git push
