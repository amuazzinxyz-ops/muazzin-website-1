name: Integrate Nearby Smart Search
on:
  push:
    branches: [main]
    paths:
      - 'nearby-smart-search-radius.js'
      - '.github/workflows/integrate-nearby-smart-search.yml'
permissions:
  contents: write
jobs:
  integrate-nearby:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ github.token }}
      - name: Connect the radius search to the main HTML
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          html = Path('1.New.Muazzin Saheb.Html')
          helper = Path('nearby-smart-search-radius.js')
          marker = '<script id="muazzin-nearby-menu-language-fix">'
          integration_id = 'id="nearby-smart-radius-integration"'
          source = html.read_text(encoding='utf-8')
          code = helper.read_text(encoding='utf-8')
          if integration_id in source:
              print('Nearby radius helper is already integrated; no change needed.')
              raise SystemExit(0)
          if source.count(marker) != 1:
              raise SystemExit('Safety check failed: expected exactly one insertion marker.')
          addition = '<script id="nearby-smart-radius-integration">\n' + code + '\n</script>\n'
          html.write_text(source.replace(marker, addition + marker, 1), encoding='utf-8')
          print('Inserted the existing helper at the verified Nearby Smart Search location.')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '1.New.Muazzin Saheb.Html'
          if git diff --cached --quiet; then
            echo 'No HTML change required.'
            exit 0
          fi
          git commit -m 'Connect Nearby Smart Search radius results'
          git push origin HEAD:main
