name: Install uploaded Muazzin HTML
on:
  push:
    branches: [main]
    paths:
      - '1.New.Muazzin%20Saheb%20HTML.zip'
      - '.github/workflows/install-uploaded-html.yml'
permissions:
  contents: write
jobs:
  install-html:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ github.token }}
      - name: Install uploaded HTML and keep site entry point working
        shell: bash
        run: |
          set -euo pipefail
          ZIP='1.New.Muazzin%20Saheb%20HTML.zip'
          test -f "$ZIP"
          ENTRY='1.New.Muazzin Saheb.Html'
          unzip -Z1 "$ZIP" | grep -Fx "$ENTRY"
          unzip -p "$ZIP" "$ENTRY" > "$ENTRY"
          test -s "$ENTRY"
          cat > index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
          <meta name="theme-color" content="#173f91">
          <meta http-equiv="refresh" content="0;url=./1.New.Muazzin%20Saheb.Html">
          <title>Muazzin Saheb</title>
          <link rel="manifest" href="./manifest-v158.webmanifest">
          <link rel="icon" type="image/png" href="./original%20masjid%20image%20.png">
          <link rel="apple-touch-icon" href="./original%20masjid%20image%20.png">
          <script>window.location.replace("./1.New.Muazzin%20Saheb.Html");</script>
          </head>
          <body></body>
          </html>
          HTML
          rm -f 'New Muazzin Saheb .html' "$ZIP"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$ENTRY" index.html
          git add -u -- 'New Muazzin Saheb .html' "$ZIP" || true
          git commit -m 'Replace old Muazzin HTML with uploaded version'
          git push origin HEAD:main