name: Integrate Nearby Smart Search
on:
  push:
    branches: [main]
    paths:
      - 'nearby-smart-search-radius.js'
      - '.github/workflows/integrate-nearby-smart-search.yml'
permissions:
  contents: write
jobs:
  integrate-nearby:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ github.token }}
      - name: Back up main before changing the HTML
        shell: bash
        run: |
          set -euo pipefail
          backup_branch="backup/nearby-before-${GITHUB_SHA}"
          git push origin "${GITHUB_SHA}:refs/heads/${backup_branch}"
          echo "Created backup branch: ${backup_branch}"
      - name: Connect the radius search to the main HTML
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          html = Path('1.New.Muazzin Saheb.Html')
          helper = Path('nearby-smart-search-radius.js')
          marker = '<script id="muazzin-nearby-menu-language-fix">'
          integration_start = '<script id="nearby-smart-radius-integration">'
          source = html.read_text(encoding='utf-8')
          code = helper.read_text(encoding='utf-8')
          addition = integration_start + '\n' + code + '\n</script>\n'
          if integration_start in source:
              start = source.index(integration_start)
              end_tag = source.find('</script>', start)
              if end_tag < 0:
                  raise SystemExit('Safety check failed: integration script has no closing tag.')
              end = end_tag + len('</script>')
              source = source[:start] + addition + source[end:]
              import re
              source = re.sub(r'(</script>)(?:\s|\\n)*(<script id="muazzin-nearby-menu-language-fix">)', lambda m: m.group(1) + '\n' + m.group(2), source, count=1)
              print('Replaced existing integration with the current helper.')
          else:
              if source.count(marker) != 1:
                  raise SystemExit('Safety check failed: expected exactly one insertion marker.')
              source = source.replace(marker, addition + marker, 1)
              print('Inserted the helper at the verified Nearby Smart Search location.')
          html.write_text(source, encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '1.New.Muazzin Saheb.Html'
          if git diff --cached --quiet; then
            echo 'No HTML change required.'
            exit 0
          fi
          git commit -m 'Connect Nearby Smart Search radius results'
          git push origin HEAD:main
