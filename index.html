<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#173f91">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" href="./file_00000000543081faa661bcf1dd8abc6f.png">
<link rel="apple-touch-icon" href="./file_00000000543081faa661bcf1dd8abc6f.png">
<title>Muazzin Saheb</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#081f45}
#site{display:block;width:100%;height:100%;height:100dvh;border:0;background:#081f45}
</style>
</head>
<body>
<iframe id="site" src="./New%20Muazzin%20Saheb%20.html" title="Muazzin Saheb" allow="geolocation"></iframe>
<script>
(function(){
  var frame=document.getElementById("site");
  frame.addEventListener("load",function(){
    try{
      var win=frame.contentWindow, doc=frame.contentDocument;
      var startY=0, pulling=false;
      doc.addEventListener("touchstart",function(e){
        if(!e.touches||e.touches.length!==1)return;
        var scroller=doc.scrollingElement||doc.documentElement;
        if(scroller.scrollTop<=0){startY=e.touches[0].clientY;pulling=true;}
        else pulling=false;
      },{passive:true});
      doc.addEventListener("touchmove",function(e){
        if(!pulling||!e.touches||e.touches.length!==1)return;
        var delta=e.touches[0].clientY-startY;
        var scroller=doc.scrollingElement||doc.documentElement;
        if(delta>100&&scroller.scrollTop<=0){pulling=false;win.location.reload();}
      },{passive:true});
      doc.addEventListener("touchend",function(){pulling=false;},{passive:true});
    }catch(e){}
  });
})();
</script>
</body>
</html>
