name: Build Android Reminder APK

on:
  push:
    paths:
      - 'android-reminder/**'
      - '.github/workflows/build-android-reminder-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: gradle -p android-reminder assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: muazzin-android-reminder-debug-apk
          path: android-reminder/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
