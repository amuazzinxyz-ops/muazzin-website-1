name: Build Muazzin Native Reminder APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-reminder/**'
      - '.github/workflows/build-native-reminder.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle -p android-reminder assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Muazzin-Native-Reminder-APK
          path: android-reminder/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
